services:
  monitor:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    env_file:
      - path: .env
        required: false
    environment:
      WB_HOST: 0.0.0.0
      WB_PORT: 8788
      WB_DATA_DIR: /app/data
      WB_ADMIN_TOKEN: ${WB_ADMIN_TOKEN:?Set WB_ADMIN_TOKEN in .env}
      WB_WEB_ORIGIN: ${WB_WEB_ORIGIN:-http://127.0.0.1:8788}
      WB_ALLOWED_ORIGINS: ${WB_ALLOWED_ORIGINS:-}
      WB_CONCURRENCY: ${WB_CONCURRENCY:-4}
      WB_HISTORY_LIMIT: ${WB_HISTORY_LIMIT:-360}
      WB_LOG_LINES: ${WB_LOG_LINES:-1000}
      WB_LOG_FILE_MB: ${WB_LOG_FILE_MB:-4}
      WB_MEMORY_CEILING_MB: ${WB_MEMORY_CEILING_MB:-512}
      WB_MAX_RUNS: ${WB_MAX_RUNS:-0}
    volumes:
      - monitor-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  monitor-data:
